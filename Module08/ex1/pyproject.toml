[tool.poetry]
name = "matrix-loading"
version = "0.1.0"
description = "Exercise 1 - Loading Programs"
authors = ["Your Name <you@example.com>"]
# Dependency management only: there is no package to build or install.
package-mode = false

[tool.poetry.dependencies]
